spring:
  application:
    name: backend

  liquibase:
    enabled: false

  datasource:
    driver-class-name: org.postgresql.Driver
    password: "${POSTGRES_PASSWORD}"
    username: "${POSTGRES_USER}"
    url: "jdbc:postgresql://localhost:5432/${POSTGRES_DB}"

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379

springdotenv:
  enabled: true
  filename: .env

pbm:
  jwt:
    secret: "${PBM_JWT_SECRET}"