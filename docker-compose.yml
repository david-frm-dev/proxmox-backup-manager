services:
  postgres:
    hostname: postgres:18
    container_name: postgres.pbm.local
    image: postgres
    restart: on-failure
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_pbm:/var/lib/postgresql

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 2s
      timeout: 5s
      retries: 5

  liquibase:
    image: liquibase/liquibase:4.31
    command:
      - --searchPath=/liquibase/changelog
      - --changelog-file=db.changelog-master.yaml
      - --url=jdbc:postgresql://postgres:5432/pbm
      - --username=${POSTGRES_USER}
      - --password=${POSTGRES_PASSWORD}
      - update
    volumes:
      - ./db:/liquibase/changelog
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  frontend:
    hostname: frontend-frontend
    container_name: frontend-frontend
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    ports:
      - "80:80"
    depends_on:
      liquibase:
        condition: service_completed_successfully

  backend:
    build:
      context: ./backend
      dockerfile: ./Dockerfile

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pbm
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

    depends_on:
      postgres: { condition: service_healthy }
      liquibase: { condition: service_completed_successfully }
    restart: unless-stopped
    ports:
      - "8080:8080"


volumes:
  postgres_data_pbm:
