<div class="container">
  <div style="display: flex; background-color: var(--app-background-primary)">
    <div
      style="display: flex; flex-direction: column; justify-content: center; align-items: start;  margin-inline: 3rem; margin-bottom: 6rem;">
      <h1>Backup Manager for Proxmox VE</h1>
      <sub>Centralized backup, restore & desaster recovery for your Proxmox-Homelab</sub>
      <mat-divider></mat-divider>
      <div class="bulletPoints">
        <mat-icon>circle</mat-icon>
        <mat-label>DAS IST EIN TEST</mat-label>
      </div>
      <div class="bulletPoints">
        <mat-icon>circle</mat-icon>
        <mat-label>DAS IST EIN TEST</mat-label>
      </div>
      <div class="bulletPoints">
        <mat-icon>circle</mat-icon>
        <mat-label>DAS IST EIN TEST</mat-label>
      </div>
      <div class="bulletPoints">
        <mat-icon>circle</mat-icon>
        <mat-label>DAS IST EIN TEST</mat-label>
      </div>
    </div>
  </div>

  <div style="display: flex;">
    <form [formGroup]="form">
      <mat-card appearance="outlined" class="cardContainer">
        <mat-card-content style=" width: 100%; display: flex; flex-direction: column; align-items: center ; justify-content: center; padding: 48px;">
          <mat-form-field appearance="outline">
            <mat-label>Username</mat-label>
            <mat-icon matPrefix>person</mat-icon>
            <input matInput formControlName="username">
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Password</mat-label>
            <mat-icon matPrefix>lock</mat-icon>
            <input matInput formControlName="password" type="password">
          </mat-form-field>

        </mat-card-content>
      </mat-card>
    </form>
  </div>
</div>
